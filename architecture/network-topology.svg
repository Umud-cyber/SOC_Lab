<text x="100" y="871" class="label" >Named volumes retain stack state; fresh post-reboot alerts verify that ingestion resumes.</text>
<text x="56" y="976" class="label" letter-spacing="1.5">SEPARATE MAINTENANCE PATH</text>
<text x="56" y="1010" class="body" >VMware NAT: 192.168.121.0/24  •  SIEM: .151  •  Ubuntu setup: .152  •  Windows setup: .146</text>
<text x="56" y="1045" class="label" >NAT-off tests are documented. Permanent endpoint isolation is not established by the supplied route evidence.</text>
