<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Mini SOC Lab architecture</title><desc id="desc">Windows and Ubuntu agents send events over the host-only network to a Docker Wazuh manager. Filebeat ships alerts to the indexer. The dashboard queries the indexer and manager API. NAT is a separate maintenance path.</desc>
